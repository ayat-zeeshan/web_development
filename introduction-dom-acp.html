<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body class="p-3 mb-2 bg-info-subtle text-info-emphasis d-flex justify-content-center align-items-center flex-column gap-3 vh-100">
    <h1>Hello, world!</h1>
    <div class="p-3 mb-2 bg-info-subtle text-info-emphasis d-flex justify-content-center align-items-center flex-column gap-3 vh-100">
    <div><h2>Meet Your Cat 🐾</h2>
    <h2 id="catPet">😺</h2>
    <h2 id="catStatus">Status: Waiting...</h2>
    <button id="catBtn">Feed Cookie 🍪</button>
    </div>
    <div><h2>Meet Your Rabbit 🐾</h2>
    <h1 id="rabbitPet">🐰</h1>
    <h2 id="rabbitStatus">Status: Waiting for a carrot...</h2>
    <button id="rabbitBtn">Give Carrot 🥕</button>
    </div>
    </div>
    <script>
        var catPet = document.getElementById("catPet");
        var catStatus = document.getElementById("catStatus");
        var catBtn = document.getElementById("catBtn");
        let catCookies = 0;

        catBtn.addEventListener("click", function () {
            catCookies++;

            if (catCookies === 1) {
                catStatus.innerText = "Status: Eating 😋 (1 cookie)";
                catPet.innerText = "😸";
            }
            else if (catCookies === 2) {
                catStatus.innerText = "Status: Eating more 😻 (2 cookies)";
                catPet.innerText = "😻";
            }
            else if (catCookies === 3) {
                catStatus.innerText = "Status: Happy & fed! 💖 (3 cookies)";
                catPet.innerText = "😽";
                catBtn.innerText = "All done! 😅";
                catBtn.disabled = true;
            }
            else {
                catStatus.innerText = "Status: Eating... (" + catCookies + " cookies)";
            }
        });
    </script>
    
    <script>
        var rabbitPet = document.getElementById("rabbitPet");
        var rabbitStatus = document.getElementById("rabbitStatus");
        var rabbitBtn = document.getElementById("rabbitBtn");
        let rabbitCarrots = 0;

        rabbitBtn.addEventListener("click", function () {
            rabbitCarrots++;

            if (rabbitCarrots === 1) {
                rabbitStatus.innerText = "Status: Nibbling softly 😋 (1 carrot)";
                rabbitPet.innerText = "🐰✨";
            }
            else if (rabbitCarrots === 2) {
                rabbitStatus.innerText = "Status: Crunching happily 😄 (2 carrots)";
                rabbitPet.innerText = "🐰😄";
            }
            else if (rabbitCarrots === 3) {
                rabbitStatus.innerText = "Status: Bunny is full & joyful! 💖 (3 carrots)";
                rabbitPet.innerText = "🐰😍";
                rabbitBtn.innerText = "No more carrots! 😅";
                rabbitBtn.disabled = true;
            }
            else {
                rabbitStatus.innerText = "Status: Eating... (" + rabbitCarrots + " carrots)";
            }
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>

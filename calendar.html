<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body class="d-flex flex-column text-align justify-content-center align-items-center gap-3 vh-100 p-3 mb-2 bg-info-subtle text-info-emphasis">
    <h1 class="text-decoration-underline display-3">Calendar</h1>
    <h1 id="display" class="display-1 p-3 mb-2 bg-warning-subtle text-warning-emphasis border border-warning border border-4 " ></h1>
    
    <script>
        function displayDate() {
            var date = new Date()

            var weekdayNames = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"]
            var monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"]

            var weekday = weekdayNames[date.getDay()]
            var day = date.getDate()
            var month = monthNames[date.getMonth()]
            var year = date.getFullYear()

            var suffix = "th"

            if (day == 1 || day == 21 || day == 31) {
                suffix = "st"
            }
            else if (day == 2 || day == 22) {
                suffix = "nd"
            }
            else if (day == 3 || day == 23) {
                suffix = "rd"
            }

            var fullDate = weekday + " " + day + suffix + " " + month + " " + year
            document.getElementById("display").innerText = fullDate
        }

        displayDate()
    </script>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>

<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Find your Grade</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <h1>Find Your Grade</h1>
    <label for="userGrade">Enter your score (1-100):</label>
    <input type="number" name="userGrade" id="userGrade"><br><br>
    <button type="button" class="btn btn-success" onclick="findGrade()">Find your Grade</button><br><br>
    <p id="output"></p>

    <script>

        function findGrade() {
            var marks = Number(document.getElementById("userGrade").value)

            
            if (isNaN(marks)) {
                document.getElementById("output").innerText = "Please enter a number."
                return
            }

            var grade
            var gpa

            if (marks >= 97) {
                grade = "A+"
                gpa = 4.00
            }
            else if (marks >= 93) {
                grade = "A"
                gpa = 3.67
            }
            else if (marks >= 90) {
                grade = "A-"
                gpa = 3.33
            }
            else if (marks >= 87) {
                grade = "B+"
                gpa = 3.00
            }
            else if (marks >= 83) {
                grade = "B"
                gpa = 2.67
            }
            else if (marks >= 80) {
                grade = "B-"
                gpa = 2.33
            }
            else if (marks >= 77) {
                grade = "C+"
                gpa = 2.00
            }
            else if (marks >= 73) {
                grade = "C"
                gpa = 1.67
            }
            else if (marks >= 70) {
                grade = "C-"
                gpa = 1.33
            }
            else if (marks >= 67) {
                grade = "D+"
                gpa = 1.00
            }
            else if (marks >= 63) {
                grade = "D"
                gpa = 0.67
            }
            else if (marks >= 60) {
                grade = "D-"
                gpa = 0.33
            }
            else {
                grade = "F"
                gpa = 0.00
            }

            document.getElementById("output").innerText = `You got ${grade} and a GPA of ${gpa}`
        }

    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>

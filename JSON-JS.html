<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Delivery tracker</title>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <h1>Delivery tracker</h1>
    <button type="button" class="btn btn-danger" onclick="save()">Save order</button>
    <button type="button" class="btn btn-danger">Track delivery</button>
    <p id="outputOne"></p>
    <p id="outputTwo"></p>
    <p id="outputThree"></p>
    <p id="outputFour"></p>
    <p id="output5"></p>
    <script>

        function save() {
            let order = {

                item: "Pizza",

                price: 5,

                shop: "My Snack Shop"

            };
            let jsonOrder = JSON.stringify(order)
            document.getElementById("outputOne").innerHTML = jsonOrder
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>

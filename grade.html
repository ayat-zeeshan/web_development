<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Find your Grade</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <h1>Find Your Grade</h1>
    <label for="userGrade">Enter your score (1-100):</label>
    <input type="number" name="userGrade" id="userGrade"><br><br>
    <button type="button" class="btn btn-success" onclick="findGrade()">Find your Grade</button><br><br>
    <p id="output"></p>
    <script>

        function findGrade() {
            var marks = document.getElementById("userGrade").value
            
            var grade
            var gpa
            if (marks >= 97) {
                grade = "A+"
                gpa = 4.00
            }
            document.getElementById("output").innerText = `You got ${grade} and a GPA of ${gpa}`

        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>

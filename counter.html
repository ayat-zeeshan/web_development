<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Counter</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <h1>Counter</h1>
    <p id="number">0</p>
    <div>
<button type="button" class="btn btn-success" onclick="add()">Add</button>
<button type="button" class="btn btn-danger" onclick="subtract()">Subtract</button>
<button type="button" class="btn btn-warning" onclick="reset()">Reset</button>

    </div>
    <script>
        var count = 0;

        function add() {
            count = count + 1;
            document.getElementById("number").innerText = count;
        }

        function subtract() {
            count = count - 1;
            document.getElementById("number").innerText = count;
        }

        function reset() {
            count = 0;
            document.getElementById("number").innerText = count;
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>

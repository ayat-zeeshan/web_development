<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Roll the dice</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        #dice {
            font-size: 8rem;
        }

        .shake {
            animation: shake 0.1s infinite;
        }

        @keyframes shake {
            0% {
                transform: translate(2px, 2px) rotate(0deg);
            }

            25% {
                transform: translate(-2px, -2px) rotate(-5deg);
            }

            50% {
                transform: translate(2px, -2px) rotate(5deg);
            }

            75% {
                transform: translate(-2px, 2px) rotate(0deg);
            }

            100% {
                transform: translate(2px, 2px) rotate(0deg);
            }
        }
    </style>
</head>

<body
    class="d-flex flex-column justify-content-center align-items-center vh-100 p-3 mb-2 bg-info-subtle text-info-emphasis">

    <div class="card d-flex flex-column justify-content-center align-items-center gap-5 vh-50 p-5">
        <div
            class="card-body p-3 mb-2 bg-light-subtle text-light-emphasis d-flex flex-column justify-content-center align-items-center gap-3 vh-50">
            <h1 id="topHeading">Ready to Roll?</h1>
            <div id="dice" class="border border-dark-subtle border border-5 py-1 px-5 rounded-4">?</div><br>
            <button type="button" class="btn btn-info btn-lg" onclick="roll()">Roll the dice</button>
            <h2 id="numMessage"></h2>

        </div>
    </div>
    <script>
        var diceArray = ["⚀", "⚁", "⚂", "⚃", "⚄", "⚅"]
        function roll() {
            var dice = document.getElementById("dice")
            var topHeading = document.getElementById("topHeading")
            var numMessage = document.getElementById("numMessage")
            dice.classList.add("shake")
            setTimeout(() => {
                dice.classList.remove("shake")
                var diceIndex = Math.floor(Math.random() * 6)
                dice.innerText = diceArray[diceIndex]
                if (diceIndex == 5) {
                    topHeading.innerText = "Lucky!"
                    numMessage.innerText = "Jackpot, You rolled a 6!"
                }
                else if (diceIndex == 0) {
                    topHeading.innerText = "Ouch...."
                    numMessage.innerText = ".... Snake Eye! Try Again."
                }
                else {
                    topHeading.innerText = "Keep Going!"
                    numMessage.innerText = "You rolled a " + (diceIndex + 1)
                }
            }, 600)
            
        }
    
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>

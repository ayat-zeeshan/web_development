<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body class="d-flex flex-column text-align justify-content-center align-items-center gap-3 vh-100">
    <h1>Shopping list app using JS</h1>
    <h2>Add your item in the input box:</h2>

    <div>
        <input type="text" name="task" id="task">
        <button type="button" class="btn btn-success" onclick="add()">Add Task</button><br><br>
    </div>
    <h1>Shopping:</h1>
    <ul id="toDoList"></ul>

    <script>
        function add() {
            var taskInput = document.getElementById("task")
            var task = taskInput.value.trim()
            if (task != "") {
                var toDoList = document.getElementById("toDoList")
                var listItem = document.createElement("li")
                listItem.innerHTML = task + '<button type="button" class="btn btn-danger" onclick="deleteTask(this)">Delete</button>'
                listItem.style.padding = "15px"
                toDoList.appendChild(listItem)
                taskInput.value = ""

            }
        }
        function deleteTask(buttonElement) {
            var listItem = buttonElement.parentNode
            listItem.remove()
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>

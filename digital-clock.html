<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body class="d-flex flex-column text-align justify-content-center align-items-center gap-3 vh-100 p-3 mb-2 bg-primary-subtle text-primary-emphasis">
    <h1>Digital Clock</h1>
    <h1 id="display" onload="displayTime()" class="border border-primary border border-5 display-1"></h1>
    <script>
        function displayTime() {
            var date = new Date()
            var h = date.getHours()
            var m = date.getMinutes()
            var s = date.getSeconds()
            var session = "AM"
            if (h >= 12) {
               session = "PM"
            }
            if (h == 0) {
                h = 12
            }
            else if (h > 12) {
                h = h - 12
            }

            h = (h < 10) ? "0" + h : h
            m = (m < 10) ? "0" + m : m
            s = (s < 10) ? "0" + s : s
            var time = h + ":" + m + ":" + s + " " + session
            document.getElementById("display").innerText = time
            setTimeout(displayTime, 1000)
        }
        displayTime()
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>

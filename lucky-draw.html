<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <h1>Lucky Draw!</h1>
    <h2>Enter your name and guess the number to win:</h2>
    <input type="text" name="name" id="name"><br><br>
    <input type="number" name="number" id="number" min="1" max="5"><br><br>
    
    <button type="button" class="btn btn-primary btn-lg" onclick="draw()">Try My Luck</button><br><br>
    <p id="output"></p>
    <p id="timer"></p>
    <script>
        let seconds = 0
        setInterval(function () {
            seconds += 1
            document.getElementById("timer").innerHTML = "You have been here for " + seconds + " seconds!"
        }, 1000)
        function draw() {
            let luckynum = Math.floor(Math.random() * 5) + 1
            let username = document.getElementById("name").value
            let usernum = document.getElementById("number").value
            if (usernum == luckynum) {
                document.getElementById("output").innerHTML = "Well done " + username + ", you guessed correctly!"
                
            }
            else {
                document.getElementById("output").innerHTML = "Sorry, better luck next time " + username + " the lucky number was " + luckynum
            }
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
